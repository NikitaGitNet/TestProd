services:
  postgres:
    image: postgres:18
    container_name: testprod-postgres
    environment:
      POSTGRES_DB: testprod
      POSTGRES_USER: testprod
      POSTGRES_PASSWORD: testprod
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testprod -d testprod"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: testprod-pgadmin
    user: root
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' 'postgres:5432:*:testprod:testprod' > /pgpass
        chmod 600 /pgpass
        cat > /pgadmin4/servers.json << 'EOF'
        {
          "Servers": {
            "1": {
              "Name": "testprod",
              "Group": "Servers",
              "Host": "postgres",
              "Port": 5432,
              "MaintenanceDB": "testprod",
              "Username": "testprod",
              "SSLMode": "prefer",
              "PassFile": "/pgpass"
            }
          }
        }
        EOF
        exec /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: testprod-api
    working_dir: /src
    volumes:
      - .:/src
    ports:
      - "8090:8090"
    environment:
      ASPNETCORE_URLS: http://+:8090
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=testprod;Username=testprod;Password=testprod
    command:
      - /bin/sh
      - -c
      - |
        dotnet restore TestProd.csproj
        dotnet run --project TestProd.csproj --urls http://0.0.0.0:8090 --artifacts-path /tmp/dotnet-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

configs:
  postgres_init:
    content: |
      CREATE TABLE IF NOT EXISTS elements (
          id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          attribute_value text,
          element_html text
      );